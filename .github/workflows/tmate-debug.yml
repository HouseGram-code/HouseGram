name: vps

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup tmate session (24/7)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Keep runner alive forever
        run: |
          echo "✅ Раннер активен 24/7. Нажми Cancel в GitHub Actions, чтобы остановить."
          echo "🌐 Ссылка на Web shell будет в логах выше."
          echo "🔑 Или используй SSH: ssh ... из логов."
          echo "⏳ Начинаем бесконечный цикл..."
          while true; do
            echo "⏳ Раннер жив... $(date)"
            sleep 300
          done
