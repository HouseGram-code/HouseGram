name: vps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run vps
        run: |
          curl -sSf https://sshx.io/get | sh -s run &
          echo "✅ Сессия sshx запущена. Ищи ссылку в логах выше."
          echo "🔄 Чтобы воркфлоу не завершился, выполняем бесконечный цикл."
          echo "⏹️ Нажми Cancel workflow в GitHub Actions, чтобы остановить."
          while true; do
            echo "⏳ Воркфлоу активен... $(date)"
            sleep 300
          done
