name: vps

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: run vps
        id: sshx
        run: |
          # Устанавливаем sshx в отдельный каталог
          curl -sSf https://sshx.io/get -o /tmp/sshx
          chmod +x /tmp/sshx
          # Запускаем в фоне и сохраняем вывод в файл
          /tmp/sshx run 2>&1 | tee /tmp/sshx.log &
          SSHX_PID=$!
          echo "SSHX_PID=$SSHX_PID" >> $GITHUB_ENV
          echo "⏳ Ждём 5 секунд, чтобы sshx инициализировался..."
          sleep 5
          echo "✅ sshx запущен (PID: $SSHX_PID)"
          echo "🔗 Ссылка появится в логах после инициализации."
          echo "🔎 Проверяем вывод..."
          cat /tmp/sshx.log | grep -i "sshx.io" || echo "⚠️ Ссылка ещё не появилась, проверь логи выше вручную."

      - name: Keep alive (24/7 mode)
        run: |
          echo "🔄 Бесконечный цикл запущен. Воркфлоу не завершится."
          echo "⏹️ Нажми 'Cancel workflow' в GitHub Actions, чтобы остановить."
          echo "📌 Чтобы найти ссылку, открой логи и ищи 'sshx.io'."
          while true; do
            echo "✅ Воркфлоу жив... $(date)"
            sleep 300
          done
