name: vps

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshx
        run: |
          curl -sSf https://sshx.io/get | sh -s run &
          echo "✅ sshx запущен в фоне."
          echo "🔗 Ищи ссылку в логах выше ↑"
          echo "⏳ Ждём 5 секунд, чтобы sshx успел запуститься..."
          sleep 5
          echo "🔄 Воркфлоу теперь висит бесконечно. Нажми Cancel, чтобы остановить."
          echo "⏰ Сессия sshx будет жить, пока активен воркфлоу."

      - name: Keep alive (24/7 mode)
        run: |
          echo "🔄 Бесконечный цикл запущен. Воркфлоу не завершится."
          echo "⏹️ Нажми 'Cancel workflow' в GitHub Actions, чтобы остановить."
          echo "⏳ Начинаем..."
          while true; do
            echo "✅ Воркфлоу жив... $(date)"
            sleep 300
          done
